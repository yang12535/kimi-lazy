name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Build
        run: python3 scripts/build.py
      - name: JavaScript checks
        run: |
          node --check dist/kimi-lazy.user.js
          node --test tests/*.test.cjs
      - name: Package integrity checks
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Browser fixture and panel regressions
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node ci/fixture_check.mjs . "$RUNNER_TEMP/fixture-out"
